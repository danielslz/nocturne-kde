<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" version="1.1">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0"   stop-color="#16141f"/>
   <stop offset="0.45" stop-color="#1c1930"/>
   <stop offset="1"   stop-color="#2a2342"/>
  </linearGradient>

  <!-- brilho roxo forte (canto superior direito) -->
  <radialGradient id="glowPurple" cx="0.75" cy="0.25" r="0.8">
   <stop offset="0"   stop-color="#bb9af7" stop-opacity="0.40"/>
   <stop offset="0.5" stop-color="#bb9af7" stop-opacity="0.12"/>
   <stop offset="1"   stop-color="#bb9af7" stop-opacity="0"/>
  </radialGradient>

  <!-- brilho magenta/rosa (centro-esquerda inferior) -->
  <radialGradient id="glowMagenta" cx="0.28" cy="0.8" r="0.7">
   <stop offset="0"   stop-color="#c7a9ff" stop-opacity="0.26"/>
   <stop offset="0.5" stop-color="#bb9af7" stop-opacity="0.08"/>
   <stop offset="1"   stop-color="#bb9af7" stop-opacity="0"/>
  </radialGradient>

  <!-- leve toque azul embaixo, discreto, pra não perder a identidade Nocturne -->
  <radialGradient id="glowBlue" cx="0.2" cy="0.95" r="0.5">
   <stop offset="0"   stop-color="#7aa2f7" stop-opacity="0.12"/>
   <stop offset="1"   stop-color="#7aa2f7" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="auroraBand" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0"    stop-color="#bb9af7" stop-opacity="0"/>
   <stop offset="0.35" stop-color="#bb9af7" stop-opacity="0.26"/>
   <stop offset="0.65" stop-color="#c7a9ff" stop-opacity="0.20"/>
   <stop offset="1"    stop-color="#7aa2f7" stop-opacity="0.08"/>
  </linearGradient>

  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
   <feGaussianBlur stdDeviation="40"/>
  </filter>
 </defs>

 <rect width="1920" height="1080" fill="url(#bg)"/>
 <rect width="1920" height="1080" fill="url(#glowPurple)"/>
 <rect width="1920" height="1080" fill="url(#glowMagenta)"/>
 <rect width="1920" height="1080" fill="url(#glowBlue)"/>

 <path d="M -100,620 C 400,520 760,760 1120,600 C 1480,440 1700,560 2020,500 L 2020,780 C 1700,840 1480,700 1120,820 C 760,940 400,760 -100,860 Z"
       fill="url(#auroraBand)" filter="url(#soft)" opacity="0.95"/>

 <path d="M0,1080 L0,900 L260,760 L520,880 L820,700 L1120,860 L1420,720 L1700,870 L1920,780 L1920,1080 Z"
       fill="#15121f" opacity="0.85"/>
 <path d="M0,1080 L0,980 L360,870 L680,960 L1000,840 L1340,950 L1660,860 L1920,940 L1920,1080 Z"
       fill="#100d18" opacity="0.9"/>

 <g fill="#c0caf5">
  <circle cx="300"  cy="180" r="1.6" opacity="0.7"/>
  <circle cx="520"  cy="120" r="1.1" opacity="0.5"/>
  <circle cx="760"  cy="240" r="1.4" opacity="0.6"/>
  <circle cx="980"  cy="140" r="1.0" opacity="0.45"/>
  <circle cx="1180" cy="220" r="1.6" opacity="0.65"/>
  <circle cx="1420" cy="160" r="1.2" opacity="0.55"/>
  <circle cx="1600" cy="260" r="1.5" opacity="0.6"/>
  <circle cx="1780" cy="130" r="1.0" opacity="0.4"/>
  <circle cx="200"  cy="340" r="1.1" opacity="0.5"/>
  <circle cx="1500" cy="360" r="1.0" opacity="0.45"/>
  <circle cx="880"  cy="60"  r="1.2" opacity="0.5"/>
  <circle cx="1320" cy="80"  r="1.0" opacity="0.4"/>
 </g>
 <circle cx="640"  cy="300" r="2.2" fill="#bb9af7" opacity="0.85"/>
 <circle cx="1240" cy="300" r="2.0" fill="#c7a9ff" opacity="0.8"/>
 <circle cx="1680" cy="420" r="1.8" fill="#bb9af7" opacity="0.75"/>
</svg>
