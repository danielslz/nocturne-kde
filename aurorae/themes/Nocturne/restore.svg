<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="32" version="1.1">
 <!-- restore (unmaximize): a front square (bottom-left) with a back square
      peeking out at the top-right. Clean, legible at small sizes.
      Front square: 8x8 at (10,14). Back square hinted by an L at top-right. -->

 <g id="inactive-center">
  <g transform="translate(0,0)" fill="none" stroke="#565f89" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
   <circle cx="16" cy="16" r="14" stroke="none" fill="#9ece6a" fill-opacity="0"/>
   <path d="M14,12 L14,10 L22,10 L22,18 L20,18"/>
   <rect x="10" y="14" width="8" height="8" rx="1.5"/>
  </g>
 </g>
 <g id="active-center">
  <g transform="translate(32,0)" fill="none" stroke="#c0caf5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
   <circle cx="16" cy="16" r="14" stroke="none" fill="#9ece6a" fill-opacity="0"/>
   <path d="M14,12 L14,10 L22,10 L22,18 L20,18"/>
   <rect x="10" y="14" width="8" height="8" rx="1.5"/>
  </g>
 </g>
 <g id="hover-center">
  <g transform="translate(64,0)">
   <circle cx="16" cy="16" r="14" fill="#9ece6a" fill-opacity="0.18"/>
   <g fill="none" stroke="#9ece6a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,12 L14,10 L22,10 L22,18 L20,18"/>
    <rect x="10" y="14" width="8" height="8" rx="1.5"/>
   </g>
  </g>
 </g>
 <g id="pressed-center">
  <g transform="translate(96,0)">
   <circle cx="16" cy="16" r="14" fill="#9ece6a" fill-opacity="0.30"/>
   <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,12 L14,10 L22,10 L22,18 L20,18"/>
    <rect x="10" y="14" width="8" height="8" rx="1.5"/>
   </g>
  </g>
 </g>
 <g id="deactivated-center">
  <g transform="translate(128,0)" fill="none" stroke="#414868" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
   <circle cx="16" cy="16" r="14" stroke="none" fill="#9ece6a" fill-opacity="0"/>
   <path d="M14,12 L14,10 L22,10 L22,18 L20,18"/>
   <rect x="10" y="14" width="8" height="8" rx="1.5"/>
  </g>
 </g>
</svg>
