<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="140" version="1.1">
 <!-- Nocturne Aurorae decoration.
      - decoration-*  : visible opaque dark surface, rounded corners (r=10)
      - mask-*        : clip mask so KWin rounds the whole window.
      NO shadow-* regions: KWin draws its own symmetric native shadow,
      which avoids the asymmetric halo a hand-made shadow produced. -->

 <!-- ===================== VISIBLE DECORATION ===================== -->
 <g id="decoration-topleft">
  <path d="M0,20 L0,10 A10,10 0 0 1 10,0 L10,20 Z" fill="#1a1b26"/>
 </g>
 <g id="decoration-top">
  <rect x="10" y="0" width="20" height="20" fill="#1a1b26"/>
 </g>
 <g id="decoration-topright">
  <path d="M30,20 L30,0 A10,10 0 0 1 40,10 L40,20 Z" fill="#1a1b26"/>
 </g>
 <g id="decoration-left">
  <rect x="0" y="20" width="10" height="20" fill="#1a1b26"/>
 </g>
 <g id="decoration-center">
  <rect x="10" y="20" width="20" height="20" fill="#1a1b26"/>
 </g>
 <g id="decoration-right">
  <rect x="30" y="20" width="10" height="20" fill="#1a1b26"/>
 </g>
 <g id="decoration-bottomleft">
  <path d="M0,40 L0,50 A10,10 0 0 0 10,60 L10,40 Z" fill="#1a1b26"/>
 </g>
 <g id="decoration-bottom">
  <rect x="10" y="40" width="20" height="20" fill="#1a1b26"/>
 </g>
 <g id="decoration-bottomright">
  <path d="M30,40 L30,60 A10,10 0 0 0 40,50 L40,40 Z" fill="#1a1b26"/>
 </g>

 <!-- ===================== CLIP MASK (r=11, 1px larger than decoration
      so the mask fully covers the decoration edge, removing the 1px AA
      light pixel at the rounded corners) ===================== -->
 <g id="mask-topleft">
  <path d="M50,20 L50,9 A11,11 0 0 1 61,0 L61,20 Z" fill="#ffffff"/>
 </g>
 <g id="mask-top">
  <rect x="61" y="0" width="18" height="20" fill="#ffffff"/>
 </g>
 <g id="mask-topright">
  <path d="M79,20 L79,0 A11,11 0 0 1 90,9 L90,20 Z" fill="#ffffff"/>
 </g>
 <g id="mask-left">
  <rect x="50" y="20" width="11" height="20" fill="#ffffff"/>
 </g>
 <g id="mask-center">
  <rect x="61" y="20" width="18" height="20" fill="#ffffff"/>
 </g>
 <g id="mask-right">
  <rect x="79" y="20" width="11" height="20" fill="#ffffff"/>
 </g>
 <g id="mask-bottomleft">
  <path d="M50,40 L50,51 A11,11 0 0 0 61,60 L61,40 Z" fill="#ffffff"/>
 </g>
 <g id="mask-bottom">
  <rect x="61" y="40" width="18" height="20" fill="#ffffff"/>
 </g>
 <g id="mask-bottomright">
  <path d="M79,40 L79,60 A11,11 0 0 0 90,51 L90,40 Z" fill="#ffffff"/>
 </g>
</svg>
