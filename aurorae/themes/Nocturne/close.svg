<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="32" version="1.1">
 <!-- 5 states, each 32x32. Every state shares identical geometry:
      a r=14 background circle (transparent unless hover/pressed) + centered glyph.
      This keeps the visual footprint constant across states (no size jump on hover). -->

 <g id="inactive-center">
  <g transform="translate(0,0)">
   <circle cx="16" cy="16" r="14" fill="#f7768e" fill-opacity="0"/>
   <path d="M11.5,11.5 L20.5,20.5 M20.5,11.5 L11.5,20.5" fill="none" stroke="#565f89" stroke-width="1.6" stroke-linecap="round"/>
  </g>
 </g>

 <g id="active-center">
  <g transform="translate(32,0)">
   <circle cx="16" cy="16" r="14" fill="#f7768e" fill-opacity="0"/>
   <path d="M11.5,11.5 L20.5,20.5 M20.5,11.5 L11.5,20.5" fill="none" stroke="#c0caf5" stroke-width="1.6" stroke-linecap="round"/>
  </g>
 </g>

 <g id="hover-center">
  <g transform="translate(64,0)">
   <circle cx="16" cy="16" r="14" fill="#f7768e" fill-opacity="0.18"/>
   <path d="M11.5,11.5 L20.5,20.5 M20.5,11.5 L11.5,20.5" fill="none" stroke="#f7768e" stroke-width="1.6" stroke-linecap="round"/>
  </g>
 </g>

 <g id="pressed-center">
  <g transform="translate(96,0)">
   <circle cx="16" cy="16" r="14" fill="#f7768e" fill-opacity="0.30"/>
   <path d="M11.5,11.5 L20.5,20.5 M20.5,11.5 L11.5,20.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>
 </g>

 <g id="deactivated-center">
  <g transform="translate(128,0)">
   <circle cx="16" cy="16" r="14" fill="#f7768e" fill-opacity="0"/>
   <path d="M11.5,11.5 L20.5,20.5 M20.5,11.5 L11.5,20.5" fill="none" stroke="#414868" stroke-width="1.6" stroke-linecap="round"/>
  </g>
 </g>
</svg>
